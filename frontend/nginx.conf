server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Statik dosyalar için önbellek ayarları (Optimizasyon)
    location ~* \.(?:css|js|jpg|svg|png|html)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Ana frontend yönlendirmesi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api isteklerini doğrudan backend container'ına yönlendir (CORS problemlerini aşmak ve güvenliği artırmak için)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
